<rect x="160" y="370" width="48" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="210" y="386" text-anchor="start" fill="#0F6E56">6 KB</text>
<rect x="208" y="370" width="30" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="258" y="386" text-anchor="start" fill="#534AB7">~4 KB (10 years)</text>
<text class="ts" x="440" y="390" text-anchor="middle" fill="#888780">Total: 32 KB budget</text>
