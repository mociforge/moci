<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="30" width="140" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text class="th" x="110" y="50" text-anchor="middle" dominant-baseline="central" fill="#791F1F">Ring 0 (hot)</text>
<text class="ts" x="110" y="68" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">Last 24h, full detail</text>
<text class="ts" x="225" y="58" text-anchor="middle" fill="#854F0B">Summarize</text>
<line x1="180" y1="58" x2="248" y2="58" stroke="#854F0B" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="256" y="30" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="326" y="50" text-anchor="middle" dominant-baseline="central" fill="#633806">Ring 1 (warm)</text>
