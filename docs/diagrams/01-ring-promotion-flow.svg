<text class="ts" x="441" y="58" text-anchor="middle" fill="#0F6E56">Distill</text>
<line x1="396" y1="58" x2="464" y2="58" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="472" y="30" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
