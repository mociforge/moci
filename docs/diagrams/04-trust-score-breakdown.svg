<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="30" width="280" height="30" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text class="ts" x="50" y="49" text-anchor="start" dominant-baseline="central" fill="#791F1F">Base: 10 points (every agent starts here)</text>
<rect x="40" y="68" width="280" height="46" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="50" y="84" text-anchor="start" dominant-baseline="central" fill="#633806">Age bonus: up to 30 points</text>
<text class="ts" x="50" y="102" text-anchor="start" dominant-baseline="central" fill="#854F0B">1 point per 10 days of existence</text>
<rect x="40" y="122" width="280" height="46" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="50" y="138" text-anchor="start" dominant-baseline="central" fill="#085041">Continuity bonus: up to 40 points</text>
<text class="ts" x="50" y="156" text-anchor="start" dominant-baseline="central" fill="#0F6E56">Unbroken daily promotion history</text>
<rect x="40" y="176" width="280" height="46" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
