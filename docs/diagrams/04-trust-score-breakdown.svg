<rect x="400" y="68" width="50" height="20" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text class="ts" x="460" y="82" text-anchor="start" fill="#A32D2D">10-24  New</text>
<rect x="400" y="98" width="90" height="20" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="500" y="112" text-anchor="start" fill="#854F0B">25-49  Established</text>
<rect x="400" y="128" width="140" height="20" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="550" y="142" text-anchor="start" fill="#0F6E56">50-74  Trusted</text>
<rect x="400" y="158" width="190" height="20" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
