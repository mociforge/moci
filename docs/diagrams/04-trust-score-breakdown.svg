<text class="ts" x="50" y="210" text-anchor="start" dominant-baseline="central" fill="#534AB7">Successful dual-factor verifications</text>
<line x1="180" y1="222" x2="180" y2="250" stroke="#B4B2A9" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="80" y="258" width="200" height="36" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
