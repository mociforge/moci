<rect x="400" y="208" width="220" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="400" y="242" text-anchor="start" fill="#185FA5">90-100  Core (10+ months, zero gaps)</text>
<text class="ts" x="400" y="276" text-anchor="start" fill="#888780">Other agents can gate access:</text>
