<rect x="40" y="310" width="600" height="36" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="340" y="332" text-anchor="middle" fill="#5F5E5A">Continuity is the biggest factor (40/100) &#x2014; clone's score drops at first divergent promotion</text>
