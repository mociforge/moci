<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="30" width="280" height="350" rx="16" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="180" y="56" text-anchor="middle" dominant-baseline="central" fill="#444441">Device A</text>
<rect x="70" y="76" width="220" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="180" y="92" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Device salt</text>
<text class="ts" x="180" y="108" text-anchor="middle" dominant-baseline="central" fill="#534AB7">256-bit CSPRNG, created once</text>
<line x1="180" y1="120" x2="180" y2="148" stroke="#534AB7" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="60" y="156" width="240" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="180" y="176" text-anchor="middle" dominant-baseline="central" fill="#085041">Device fingerprint</text>
<text class="ts" x="180" y="194" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">keccak256(salt + host + home + id)</text>
<line x1="180" y1="212" x2="180" y2="240" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="230" text-anchor="start" fill="#0F6E56">PBKDF2 100K</text>
<rect x="70" y="248" width="100" height="36" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="120" y="270" text-anchor="middle" dominant-baseline="central" fill="#633806">HMAC key</text>
<rect x="190" y="248" width="100" height="36" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="240" y="270" text-anchor="middle" dominant-baseline="central" fill="#633806">AES key</text>
<line x1="240" y1="284" x2="240" y2="310" stroke="#854F0B" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="120" y1="284" x2="120" y2="310" stroke="#854F0B" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="60" y="318" width="240" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="180" y="334" text-anchor="middle" dominant-baseline="central" fill="#712B13">identity.enc</text>
<text class="ts" x="180" y="350" text-anchor="middle" dominant-baseline="central" fill="#993C1D">AES-256-GCM encrypted</text>
<rect x="380" y="30" width="260" height="350" rx="16" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="510" y="56" text-anchor="middle" dominant-baseline="central" fill="#444441">Device B (different)</text>
<rect x="400" y="76" width="220" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="510" y="92" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Different salt</text>
<text class="ts" x="510" y="108" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Different random bytes</text>
<line x1="510" y1="120" x2="510" y2="148" stroke="#534AB7" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="390" y="156" width="240" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="510" y="176" text-anchor="middle" dominant-baseline="central" fill="#085041">Different fingerprint</text>
<text class="ts" x="510" y="194" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Different host, home, salt</text>
<line x1="510" y1="212" x2="510" y2="240" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="410" y="248" width="200" height="36" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="510" y="270" text-anchor="middle" dominant-baseline="central" fill="#633806">Different keys</text>
<line x1="510" y1="284" x2="510" y2="310" stroke="#854F0B" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="390" y="318" width="240" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text class="th" x="510" y="340" text-anchor="middle" dominant-baseline="central" fill="#791F1F">DECRYPT_FAILED</text>
<text class="ts" x="510" y="356" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">Wrong key, file is useless</text>
<path d="M300 340 L370 340" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="335" y="332" text-anchor="middle" fill="#A32D2D">Copy file</text>
</svg>
